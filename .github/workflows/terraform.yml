name: terraform

# Validates formatting, syntax and security on every push/PR. Plans on PR so
# reviewers see the diff; apply is gated behind the GitHub "production" environment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: fmt • validate • tflint • checkov
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        working-directory: environments/${{ matrix.env }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: environments/${{ matrix.env }}
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --recursive

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          quiet: true
          soft_fail: true
